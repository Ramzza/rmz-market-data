[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmz-market-data"
version = "0.1.0"
description = "Historical stock, ETF, and RON exchange-rate data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
]

[project.scripts]
rmz-market-data = "rmz_market_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
